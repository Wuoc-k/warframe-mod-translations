<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101416">
  <meta name="description" content="Find any Warframe mod by its name in any language. Compare all official translations alongside the complete mod card.">
  <title>Warframe Mod Names</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip" href="#results">Skip to results</a>
  <header>
    <h1><a href="./">Warframe Mod Names</a></h1>
  </header>
  <main>
    <section class="search-panel" aria-label="Find mods">
      <label for="search" class="sr">Search mods in any language</label>
      <div class="searchbox"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search any mod name, in any language…"></div>
      <div class="filters">
        <label><span>Category</span><select id="category" aria-label="Category"><option value="">All categories</option></select></label>
        <label><span>Mod type</span><select id="tag" aria-label="Mod type"><option value="">All types</option></select></label>
        <label><span>Rarity</span><select id="rarity" aria-label="Rarity"><option value="">All rarities</option></select></label>
        <button id="reset" class="text-button">Reset</button>
      </div>
    </section>
    <div class="result-bar"><p id="status" role="status" aria-live="polite">Loading mods…</p><label class="sort-label"><span class="sr">Sort results</span><select id="sort"><option value="name">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="category">Category</option><option value="rarity">Rarity</option></select></label></div>
    <section id="results" tabindex="-1" aria-label="Mod results" aria-busy="true"></section>
    <nav class="pagination" aria-label="Result pages"><button id="prev" aria-label="Previous page">← Previous</button><span id="pageInfo"></span><button id="next" aria-label="Next page">Next →</button></nav>
  </main>
  <footer><p id="snapshot"></p><a href="./THIRD_PARTY_NOTICES.md">Credits & licenses</a></footer>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
